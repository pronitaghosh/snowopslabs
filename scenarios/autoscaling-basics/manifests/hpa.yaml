# HPA: hold {{.WorkloadName}} at its CPU target between its replica bounds.
# CPU reacts slower than request rate, so the drill holds load for minutes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{.WorkloadName}}"
  namespace: "{{.WorkloadNamespace}}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "{{.WorkloadName}}"
  minReplicas: {{.MinReplicas}}
  maxReplicas: {{.MaxReplicas}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{.CPUTarget}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
